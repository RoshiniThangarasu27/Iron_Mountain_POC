[project]
name = "doc-ingestion-backend"
version = "1.0.0"
description = "FastAPI backend for healthcare 837 EDI / EOB document ingestion"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0.57,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.uv]
package = false
exclude-newer = "2026-11-05T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
